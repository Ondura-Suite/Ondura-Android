name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image has the Android SDK (ANDROID_HOME); add what is missing.
      - name: Android SDK packages
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust bridge (clippy)
        working-directory: rust
        run: |
          cargo clippy -p ondura-mobile --all-targets -- -D warnings
          cargo test -p ondura-mobile

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(grep '^ondura.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ondura.jks"
            echo "ONDURA_KEYSTORE_FILE=$RUNNER_TEMP/ondura.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – the release APK is signed with a throwaway debug key."
          fi

      - name: Build
        env:
          ONDURA_GRAPH_CLIENT_ID: ${{ vars.ONDURA_GRAPH_CLIENT_ID }}
          ONDURA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ONDURA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ONDURA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ONDURA_GRAPH_CLIENT_ID" ]; then
            echo "::warning::Variable ONDURA_GRAPH_CLIENT_ID is not set – Microsoft 365 sign-in is disabled in this build."
          fi
          ./gradlew --no-daemon :mail:assembleRelease -Pondura.versionName=${{ steps.version.outputs.name }}

      - name: Screenshots
        run: ./gradlew --no-daemon :mail:testDebugUnitTest --tests '*Screenshots*'

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: mail/build/screenshots/*.png

      - name: Collect APK
        run: |
          mkdir -p dist
          cp mail/build/outputs/apk/release/mail-release.apk "dist/Ondura-Mail-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Ondura-Mail-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
