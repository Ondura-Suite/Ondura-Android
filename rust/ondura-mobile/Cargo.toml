[package]
name = "ondura-mobile"
description = "Bridge between the Ondura Android apps and the shared Rust core of Ondura (Ondura-Core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "ondura_mobile"
crate-type = ["cdylib", "lib"]

# The core crates come straight from Ondura-Core, pinned to a commit so a
# build is reproducible. Bump `rev` (all of them together) to pick up changes.
[dependencies]
ondura-mail-core = { git = "https://github.com/Ondura-Suite/Ondura-Core", rev = "843abadc7b9b586142a1e4ede709d0fc70f65576" }
ondura-mail-imap = { git = "https://github.com/Ondura-Suite/Ondura-Core", rev = "843abadc7b9b586142a1e4ede709d0fc70f65576" }
ondura-mail-graph = { git = "https://github.com/Ondura-Suite/Ondura-Core", rev = "843abadc7b9b586142a1e4ede709d0fc70f65576" }
ondura-mail-ews = { git = "https://github.com/Ondura-Suite/Ondura-Core", rev = "843abadc7b9b586142a1e4ede709d0fc70f65576" }
ondura-i18n = { git = "https://github.com/Ondura-Suite/Ondura-Core", rev = "843abadc7b9b586142a1e4ede709d0fc70f65576" }

uniffi.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "http2", "charset"] }
quick-xml = "0.38"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"
tracing-log = "0.2"

