org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Version of the Android apps (the version code comes from the CI build number).
ondura.versionName=0.1.0

# ABIs the Rust core is built for (comma separated). For a quick local build
# on a phone: ./gradlew :mail:installDebug -Pondura.abis=arm64-v8a
ondura.abis=arm64-v8a,armeabi-v7a,x86_64
